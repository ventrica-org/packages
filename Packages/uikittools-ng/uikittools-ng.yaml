name: "uikittools-ng"
version: "2.1.8"
description: "Next-gen uikittools for iOS 11+ (though probably will work on 9+)"
license: "BSD-3-Clause"
homepage: "https://github.com/ProcursusTeam/uikittools-ng"
category: "developer"

platforms:
  - os: macos
    archs: [arm64, x86_64]

strategy:
  uses: shell
  cache: true
  sha256: "694fdc49582c1b3921cf36377de7e82b5f5d5801da38a30ccbc0e1d5593c0561"
  sources:
    - url: "https://github.com/ProcursusTeam/uikittools-ng/archive/refs/tags/v2.1.8.tar.gz"
      type: tgz

  steps:
    build: |
      make LDID="true"

    install: |
      make install LDID="true" DESTDIR=${DESTDIR} PREFIX=${PREFIX}