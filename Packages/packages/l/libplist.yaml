name: "libplist"
version: "2.7.0"
description: "Library for Apple Binary- and XML-Property Lists"
license: "LGPL-2.1-or-later"
homepage: "https://www.libimobiledevice.org/"
category: "libraries"

platforms:
  - os: macos
    archs: [x86_64, arm64]

strategy:
  uses: shell
  cache: true
  sha256: "7ac42301e896b1ebe3c654634780c82baa7cb70df8554e683ff89f7c2643eb8b"
  sources:
    - url: "https://github.com/libimobiledevice/libplist/releases/download/2.7.0/libplist-2.7.0.tar.bz2"
      type: "tbz2"


  steps:
    - name: Build
      run: |
        ./configure \
          --prefix=${PREFIX} \
          --disable-dependency-tracking
        make

    - name: Install
      run: |
        make install DESTDIR=${DESTDIR}